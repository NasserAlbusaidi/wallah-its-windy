name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run calibrate:check
      # Sealed HF-6 cohort must stay in sync with the runtime it certifies.
      # Omitting these let a037c4a change src/hindcast-benchmark.ts without
      # re-sealing, leaving the reproduction command broken while CI stayed green.
      # gate:check is not redundant: hf6-acceptance.json hashes the sealed file,
      # so re-sealing without re-running the gate fails here and only here.
      - run: npm run hf6:verify:check
      - run: npm run hf6:gate:check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
