<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="Wallah It's Windy — spawn a tropical cyclone in the Arabian Sea and let the environment decide its fate."
    />
    <meta name="color-scheme" content="dark" />
    <title>WALLAH IT'S WINDY</title>
  </head>
  <body>
    <div id="app">
      <!-- WebGL2 map (terrain, env glow, particles, rain) -->
      <canvas id="gl-canvas"></canvas>
      <!-- 2D vector overlay (track dots, halos, debug) above the map -->
      <canvas id="overlay-canvas"></canvas>

      <!-- thin cyan loading line -->
      <div id="progress"></div>

      <!-- chrome: all type, no icons -->
      <h1 id="title" class="chrome">Wallah It's <span class="accent">Windy</span></h1>

      <div id="month-picker" class="chrome">
        <label for="month">Month</label>
        <!-- Only the Arabian-Sea cyclone season (May-Nov) is baked into env.bin;
             off-season months clamp to a neighbour, so offering them would alias
             silently. Restrict the picker to the season that actually varies. -->
        <select id="month" aria-label="Spawn month">
          <option value="4" selected>May</option>
          <option value="5">June</option>
          <option value="6">July</option>
          <option value="7">August</option>
          <option value="8">September</option>
          <option value="9">October</option>
          <option value="10">November</option>
        </select>

        <!-- Scenario picker (C8): climatology sandbox, or replay a historic event
             (Gonu 2007 / Shaheen 2021) as a counterfactual. main.ts owns the change
             listener + lazy env-bin fetch; the picker disables itself when the
             scenario catalogue (data/scenarios.json) is absent. -->
        <label for="scenario">Scenario</label>
        <select id="scenario" aria-label="Scenario">
          <option value="climatology" selected>climatology</option>
          <option value="gonu">gonu 2007</option>
          <option value="shaheen">shaheen 2021</option>
        </select>
      </div>

      <!-- Flight recorder: live physics explanation, then an immutable
           post-storm debrief + scrub transport. All controls observe recorded
           frames; they never rewind the deterministic simulation engine. -->
      <section id="flight-recorder" class="chrome" aria-label="Storm flight recorder" hidden>
        <header class="flight-head">
          <span id="flight-status">live tape</span>
          <output id="flight-clock">0 h</output>
          <span id="flight-label"></span>
        </header>

        <dl class="flight-readouts" aria-label="Current storm physics">
          <div class="flight-readout primary">
            <dt>trend</dt>
            <dd><output id="flight-trend">+0.0 kt/h</output></dd>
          </div>
          <div class="flight-readout">
            <dt>ocean</dt>
            <dd><output id="flight-ocean">+0.0</output></dd>
          </div>
          <div class="flight-readout">
            <dt>sst / mpi</dt>
            <dd><output id="flight-sst">—</output></dd>
          </div>
          <div class="flight-readout">
            <dt>shear</dt>
            <dd><output id="flight-shear">—</output></dd>
          </div>
          <div class="flight-readout">
            <dt>land / dry</dt>
            <dd><output id="flight-land-dry">—</output></dd>
          </div>
          <div class="flight-readout">
            <dt>steering</dt>
            <dd><output id="flight-steering">—</output></dd>
          </div>
        </dl>

        <div id="flight-debrief" aria-live="polite" hidden>
          <p id="flight-verdict"></p>
          <dl class="debrief-grid">
            <div><dt>peak</dt><dd id="debrief-peak">—</dd></div>
            <div><dt>life</dt><dd id="debrief-life">—</dd></div>
            <div><dt>muscat</dt><dd id="debrief-muscat">—</dd></div>
            <div><dt>landfall</dt><dd id="debrief-landfall">—</dd></div>
            <div id="debrief-compare-row"><dt>history</dt><dd id="debrief-compare">—</dd></div>
          </dl>
        </div>

        <div class="flight-transport">
          <button id="flight-toggle" type="button">pause</button>
          <input
            id="flight-scrubber"
            type="range"
            min="0"
            max="0"
            value="0"
            step="1"
            aria-label="Storm replay timeline"
            disabled
          />
          <nav id="flight-jumps" aria-label="Replay milestones" hidden>
            <button id="flight-start" type="button">start</button>
            <button id="flight-peak" type="button">peak</button>
            <button id="flight-landfall" type="button">landfall</button>
            <button id="flight-end" type="button">end</button>
          </nav>
        </div>
      </section>

      <!-- caption / epitaph slot -->
      <p id="caption" class="chrome hint">click the sea to spawn your own</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
